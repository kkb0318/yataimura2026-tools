[project]
name = "field-map-generator"
version = "1.0.0"
description = "人間ロボットゲーム＆ロジック宝探し フィールドマップPDF生成ツール"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_map_generator"]

[project.scripts]
generate-map = "field_map_generator.cli:main"
