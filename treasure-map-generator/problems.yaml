  code: |
    # main.py
    def move(row, col, facing, steps):
        """現在の向きにstepsマスすすみ、新しい(row, col)を返す"""

    def turn(facing, direction):
        """direction（みぎ/ひだり/後ろ）に向きを変え、新しいfacingを返す"""

    def cell_number(row, col):
        """そのマスに書かれたすうじを返す（なければ0）"""

    def open_treasure(row, col):
        """そのマスのたからばこをひらく"""

    # 初期状態
    row, col = 5, 7
    facing = "窓の方向"

    row, col = move(row, col, facing, 1)
    facing = turn(facing, "みぎ")
    row, col = move(row, col, facing, 1)

    for _ in range(3):
        facing = turn(facing, "ひだり")
        row, col = move(row, col, facing, 1)
        if cell_number(row, col) >= 2:
            facing = turn(facing, "後ろ")

    row, col = move(row, col, facing, 1)
    open_treasure(row, col)
