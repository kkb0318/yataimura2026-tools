[project]
name = "human-robot-fieldmap"
version = "1.0.0"
description = "人間ロボットゲーム用フィールドマップPDF生成ツール"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
fieldmap = "src.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
