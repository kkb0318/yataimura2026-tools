# ============================================================
# 人間ロボットゲーム フィールドマップ設定
# ============================================================
# マスの座標は (行, 列) で指定します（1始まり）
#   行: 上から 1〜rows
#   列: 左から 1〜cols
#
# 例: 1行目・2列目 → [1, 2]
# ============================================================

# --- グリッドサイズ ---
grid:
  rows: 5
  cols: 10

# --- タイトル ---
title: "人間ロボットゲーム"
subtitle: "〜 フィールドマップ 〜"

# --- たからもの ---
# 位置 [行, 列] とラベル（A, B, C, ...）を指定
treasures:
  - pos: [1, 2]
    label: "A"
  - pos: [1, 5]
    label: "B"
  - pos: [1, 7]
    label: "C"
  - pos: [2, 8]
    label: "D"
  - pos: [3, 3]
    label: "E"
  - pos: [3, 9]
    label: "F"
  - pos: [4, 1]
    label: "G"

# --- スタート位置 ---
start: [5, 4]

# --- 障害物 ---
obstacles:
  - [5, 5]
  - [5, 6]

# --- 出力設定 ---
output: "field_map.pdf"
