[project]
name = "human-robot-cards"
version = "1.0.0"
description = "人間ロボットゲーム 指令カード PDF生成ツール"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/human_robot_cards"]

[project.scripts]
generate-cards = "human_robot_cards.cli:main"
