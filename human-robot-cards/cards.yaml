# ============================================================
# 人間ロボットゲーム カード定義ファイル
# ============================================================
#
# カードを追加・変更するにはこのファイルを編集してください。
#
# 各カードの書式:
#   - text1: "上段テキスト"
#     text2: "下段テキスト"
#     icon: アイコン名 (arrow_up, turn_right, turn_left, turn_back,
#                       treasure, loop_start, loop_end, point,
#                       variable_step, condition)
#     category: カテゴリ名 (move, turn, action, loop, point, condition)
#     count: 枚数
#
# 新しい難易度を追加するには levels: の下に新しいエントリを追加します。
# ============================================================

# --- 難易度(色)の定義 ---
levels:
  blue:
    label: "きほん"
    colors:
      bg: "#E3F2FD"
      border: "#1565C0"
      header_bg: "#1565C0"
      accent: "#1976D2"

  yellow:
    label: "ちゅうきゅう"
    colors:
      bg: "#FFF8E1"
      border: "#F9A825"
      header_bg: "#F9A825"
      accent: "#FBC02D"

  red:
    label: "上級"
    colors:
      bg: "#FFEBEE"
      border: "#C62828"
      header_bg: "#C62828"
      accent: "#D32F2F"

# --- カテゴリバッジの定義 ---
categories:
  move:
    label: "いどう"
    color: "#4CAF50"
  turn:
    label: "ほうこう"
    color: "#FF9800"
  action:
    label: "アクション"
    color: "#9C27B0"
  loop:
    label: "くりかえし"
    color: "#00BCD4"
  point:
    label: "ポイント"
    color: "#FF5722"
  condition:
    label: "じょうけん"
    color: "#607D8B"

