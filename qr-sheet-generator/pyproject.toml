[project]
name = "qr-sheet-generator"
version = "1.0.0"
description = "URL一覧からQRコード面付けPDFを生成するツール"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qr_sheet_generator"]

[project.scripts]
generate-qr-sheet = "qr_sheet_generator.cli:main"
